<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozarks Eldritch</title>
<meta name="description" content="Something waits below the springs.">
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0b0d10;
    --card:#0e1014;
    --gold:#c9a24a;
    --gold-dim:#8a6f33;
    --bone:#e9e4d8;
    --bone-dim:#a9a397;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--ink); color:var(--bone); }
  body {
    font-family:"Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
    font-size:19px; line-height:1.45;
    min-height:100dvh;
    background:
      radial-gradient(120% 60% at 50% 0%, #1a1c22 0%, var(--ink) 70%);
  }
  .page { max-width:480px; margin:0 auto; padding:28px 18px 60px; }

  /* countdown */
  .count {
    border:1px solid var(--gold-dim); padding:14px 10px 10px;
    display:grid; grid-template-columns:repeat(4,1fr); text-align:center;
    background:rgba(11,13,16,.75);
  }
  .count .n { font-size:34px; color:var(--gold); font-variant-numeric:tabular-nums; line-height:1; }
  .count .l { font-size:11px; letter-spacing:.14em; color:var(--bone-dim); margin-top:6px; }
  .count.opened { grid-template-columns:1fr; }
  .count.opened .n { font-size:22px; font-style:italic; }

  /* portrait */
  .portrait { position:relative; margin:22px -18px 0; aspect-ratio:896/335; overflow:hidden; }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block; filter:saturate(.85); }
  .portrait::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(11,13,16,.55) 0%, rgba(11,13,16,0) 30%, rgba(11,13,16,0) 60%, var(--ink) 100%);
  }

  /* card */
  .card {
    position:relative; margin-top:-46px;
    border:1px solid var(--gold-dim); background:var(--card);
    padding:30px 24px 28px; text-align:center;
  }
  .sigil { width:46px; height:46px; margin:0 auto 14px; display:block; }
  .place { color:var(--gold); font-size:15px; letter-spacing:.12em; margin:0 0 20px; }
  .bird { font-style:italic; color:var(--gold); font-size:34px; line-height:1.1; margin:0 0 14px; }
  .lede { font-size:22px; margin:0; }
  .lede + .lede { margin-top:6px; }
  .rule { width:70px; height:1px; background:var(--gold-dim); margin:26px auto 22px; }

  /* substack */
  .sub { margin:0 -8px; }
  .sub iframe { width:100%; height:320px; border:0; display:block; background:transparent; }
  .fallback { margin:14px 0 0; font-size:15px; color:var(--bone-dim); }
  .fallback a { color:var(--gold); text-decoration:none; border-bottom:1px solid var(--gold-dim); }
  .fallback a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

  .waits { font-size:14px; letter-spacing:.09em; color:var(--bone); margin:0; }
  .foot { text-align:center; margin-top:26px; font-size:13px; color:var(--bone-dim); }
  .foot a { color:inherit; }

  @media (min-width:481px) {
    .portrait { margin-left:0; margin-right:0; }
  }
</style>
</head>

<script>
(function(){
  // Zombie Crawl parade steps off 6pm Central, Sat Oct 24 2026 (CDT = UTC-5)
  var target = new Date("2026-10-24T18:00:00-05:00").getTime();
  var box=document.getElementById("count");
  var D=document.getElementById("d"),H=document.getElementById("h"),M=document.getElementById("m"),S=document.getElementById("s");
  var pad=function(n){return String(n).padStart(2,"0");};
  function tick(){
    var diff=target-Date.now();
    if(diff<=0){
      box.className="count opened";
      box.innerHTML='<div><div class="n">The springs have opened.</div></div>';
      return;
    }
    var s=Math.floor(diff/1000);
    D.textContent=pad(Math.floor(s/86400));
    H.textContent=pad(Math.floor(s%86400/3600));
    M.textContent=pad(Math.floor(s%3600/60));
    S.textContent=pad(s%60);
    setTimeout(tick,1000);
  }
  tick();
})();
</script>
