<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Springfield Test Ground — Eldritch Cartography mechanic test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --ink:#0d0b12; --ink-2:#16121d;
    --parchment:#e8ddc7; --parchment-dim:#a9a084;
    --accent:#9a5ec9; --story:#c99a3e; --free:#4f9d84; --line:#3a3346;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--parchment);
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}
  #map{width:100%;height:100%;}

  .map-toggle{position:absolute;top:14px;right:14px;z-index:1000;width:auto;
    background:var(--ink-2);border:1px solid var(--line);color:var(--parchment);
    border-radius:5px;padding:8px 12px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.5);
    font-family:inherit;cursor:pointer;}
  .map-toggle:hover{filter:brightness(1.15);}

  .eldritch-marker{border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px rgba(0,0,0,.5), 0 0 10px rgba(0,0,0,.6);cursor:pointer;}
  .you-are-here{width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 3px var(--ink), 0 0 0 6px rgba(255,255,255,.6), 0 0 14px rgba(0,0,0,.5);
    animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}

  .leaflet-popup-content-wrapper{background:var(--ink-2);color:var(--parchment);
    border:1px solid var(--line);border-radius:6px;}
  .leaflet-popup-tip{background:var(--ink-2);}
  .popup-title{font-size:1rem;margin:0 0 6px;}
  .popup-body{font-size:.85rem;line-height:1.5;color:var(--parchment-dim);margin:0 0 8px;}
  .popup-status{font-size:.82rem;line-height:1.5;color:var(--story);min-height:1.2em;margin:0 0 8px;}
  .popup-btn{font-family:inherit;background:var(--accent);color:var(--ink);border:none;
    border-radius:4px;padding:9px 14px;font-size:.85rem;cursor:pointer;width:100%;letter-spacing:.02em;}
  .popup-btn:hover{filter:brightness(1.12);}
  .popup-btn:disabled{opacity:.6;cursor:default;}

  #story{display:none;position:fixed;inset:0;background:var(--ink);z-index:2000;
    overflow-y:auto;}
  #story.open{display:block;}
  .story-wrap{max-width:640px;margin:0 auto;padding:0 0 60px;}
  .story-art{width:100%;display:block;}
  .story-content{padding:28px 24px 0;}
  .story-eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;
    color:var(--story);margin:0 0 6px;}
  .story-content h1{font-size:1.5rem;font-weight:400;line-height:1.25;margin:0 0 18px;
    letter-spacing:.01em;}
  .story-lede{font-style:italic;color:var(--parchment-dim);font-size:1.02rem;
    margin:0 0 22px;line-height:1.6;}
  .story-content p{line-height:1.75;font-size:1.02rem;margin:0 0 20px;}
  .story-gift{border-left:2px solid var(--story);background:var(--ink-2);
    padding:16px 20px;margin:32px 0 8px;font-size:.95rem;line-height:1.7;}
  .story-gift b{color:var(--story);letter-spacing:.03em;}
  .story-back{display:block;margin:36px 0 0;text-align:center;}
  .story-back button{background:none;border:none;color:var(--accent);
    font-family:inherit;font-size:.9rem;cursor:pointer;padding:8px;}
  .story-back button:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="map">
  <button id="theme-toggle" class="map-toggle">🗺 Show plain map</button>
</div>


<div id="story">
  <div class="story-wrap">
    <img class="story-art" id="story-art" src="" alt="">
    <div class="story-content">
      <p class="story-eyebrow" id="story-eyebrow"></p>
      <h1 id="story-h1"></h1>
      <p class="story-lede" id="story-lede"></p>
      <div id="story-body"></div>
      <div class="story-gift" id="story-gift"></div>
    </div>
    <div class="story-back"><button id="story-back-btn">&larr; back to the map</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  const OVERLAY = {
    enabled: true,
    url: SPRINGFIELD_MAP_DATA_URI,
    altUrl: 'assets/springfield-eldritch-map-alt.webp',
    bounds: [[37.098901, -93.297897], [37.123585, -93.278630]], // SW, NE — fitted, see note above
    opacity: 0.55,
    blendMode: 'normal'
  };
  let paintedLayer = null;
  if (OVERLAY.enabled) {
    paintedLayer = L.imageOverlay(OVERLAY.url, OVERLAY.bounds, { opacity: OVERLAY.opacity }).addTo(map);
    const overlayEl = paintedLayer.getElement();
    if (overlayEl) overlayEl.style.mixBlendMode = OVERLAY.blendMode;
    map.fitBounds(OVERLAY.bounds, { padding: [10, 10] });
  }

  let paintedVisible = true;
  function updateToggleLabel(){
    document.getElementById('theme-toggle').textContent =
      paintedVisible ? '🗺 Show plain map' : '🖌 Show painted map';
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    if (!paintedLayer) return;
    if (paintedVisible) { map.removeLayer(paintedLayer); }
    else { paintedLayer.addTo(map); }
    paintedVisible = !paintedVisible;
    updateToggleLabel();
  });
  updateToggleLabel();

  function nodeIcon(color, size = 20){
    return L.divIcon({
      className: '',
      html: `<div class="eldritch-marker" style="width:${size}px;height:${size}px;background:${color};"></div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -size/2]
    });
  }

  function haversineMeters(a, b){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b[0]-a[0]);
    const dLon = toRad(b[1]-a[1]);
    const lat1 = toRad(a[0]);
    const lat2 = toRad(b[0]);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }


  function showStory(nodeId){
    const c = NODE_CONTENT[nodeId];
    if(!c) return;
    document.getElementById('story-art').src = c.img;
    document.getElementById('story-art').alt = c.alt;
    document.getElementById('story-eyebrow').textContent = c.eyebrow;
    document.getElementById('story-h1').textContent = c.h1;
    document.getElementById('story-lede').textContent = c.lede;
    document.getElementById('story-body').innerHTML = c.body.map(p => `<p>${p}</p>`).join('');
    document.getElementById('story-gift').innerHTML = `<b>${c.giftLabel}</b> ${c.giftText}`;
    document.getElementById('story').classList.add('open');
    window.scrollTo(0,0);
  }
  document.getElementById('story-back-btn').addEventListener('click', () => {
    document.getElementById('story').classList.remove('open');
  });

  TEST_NODES.forEach(node => {
    const marker = L.marker(node.coords, { icon: nodeIcon('#c99a3e') }).addTo(map);

    marker.bindPopup(() => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <h3 class="popup-title">${node.name}</h3>
        <p class="popup-body">Geofence: ${node.geofenceRadiusM}m</p>
        <p class="popup-status" data-status></p>
        <button class="popup-btn" data-checkin>I'm here</button>
      `;
      const statusEl = wrap.querySelector('[data-status]');
      const btn = wrap.querySelector('[data-checkin]');

      btn.addEventListener('click', () => {
        if(!navigator.geolocation){
          statusEl.textContent = 'This browser has no geolocation to give.';
          return;
        }
        if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
          statusEl.textContent = 'Needs HTTPS to check location — serve this over https:// to test on your phone.';
          return;
        }
        btn.disabled = true;
        statusEl.textContent = 'Checking your position…';

        navigator.geolocation.getCurrentPosition(pos => {
          const here = [pos.coords.latitude, pos.coords.longitude];
          const dist = Math.round(haversineMeters(here, node.coords));

          if(!youAreHereMarker){
            youAreHereMarker = L.marker(here, {
              icon: L.divIcon({ className:'', html:'<div class="you-are-here"></div>', iconSize:[16,16], iconAnchor:[8,8] })
            }).addTo(map);
          } else {
            youAreHereMarker.setLatLng(here);
          }

          if(dist <= node.geofenceRadiusM){
            statusEl.textContent = `You're here (${dist}m). Opening…`;
            map.closePopup();
            showStory(node.id);
          } else {
            statusEl.textContent = `${dist}m away — get within ${node.geofenceRadiusM}m and try again.`;
            btn.disabled = false;
          }
        }, err => {
          statusEl.textContent = `Location denied or unavailable (${err.message}).`;
          btn.disabled = false;
        }, { enableHighAccuracy: true, maximumAge: 0 });
      });

      return wrap;
    });
  });

  let youAreHereMarker = null;
</script>
</body>
</html>
